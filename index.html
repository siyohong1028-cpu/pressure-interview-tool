<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>压面题库生成中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== RESET & DESIGN TOKENS ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#8FA8DB;
  --text:rgba(255,255,255,0.92);
  --text2:rgba(255,255,255,0.72);
  --text3:rgba(255,255,255,0.50);
  --card:#C2DEF4;
  --history:#E8EEFF;
  --surface:rgba(255,255,255,0.35);
  --surface2:rgba(255,255,255,0.55);
  --border:rgba(99,97,75,0.15);
  --border2:rgba(99,97,75,0.25);
  --accent:#c4622a;
  --accent2:#e07b39;
  --radius:14px;
  --radius-sm:10px;
  --font:"PingFang SC","Microsoft YaHei","Helvetica Neue",system-ui,-apple-system,sans-serif;
}
html{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
/* Box containers keep original gray text */
.upload-zone,.preview-box,.card,.history-panel,.toast{--text:#6F7C80;--text2:#8a9598;--text3:#a5aeb0}

/* ===== HEADER ===== */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(143,168,219,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between
}
.header-l{display:flex;align-items:center;gap:12px}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.2px}
.logo span{color:var(--text)}
.header-r{display:flex;align-items:center;gap:16px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .2s}
.ai-dot.active{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.4)}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit;transition:all .2s;white-space:nowrap
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(196,98,42,0.3)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--surface);color:var(--text);border-color:var(--text3)}
.btn-danger{background:transparent;color:#c44;border:1px solid rgba(204,68,68,0.25)}
.btn-danger:hover{background:rgba(204,68,68,0.08)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ===== LAYOUT ===== */
.body-wrap{display:flex;min-height:calc(100vh - 56px)}
.main{flex:1;max-width:1100px;margin:0 auto;padding:32px 24px 80px;width:100%}

/* ===== UPLOAD ZONE ===== */
.upload-zone{
  border:2px dashed var(--border2);border-radius:var(--radius);
  padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;
  background:var(--surface);margin-bottom:24px
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(255,255,255,0.5)}
.upload-zone h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
.upload-zone p{color:var(--text2);font-size:13px}
.format-badges{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.format-badge{
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--surface2);border:1px solid var(--border2);color:var(--text2)
}
input[type="file"]{display:none}

/* ===== PREVIEW BOX ===== */
.preview-box{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:20px;margin-bottom:24px;display:none
}
.preview-box h4{font-size:13px;color:var(--text2);margin-bottom:10px}

/* ===== TEXTAREA / INPUT ===== */
.notes-textarea{
  width:100%;min-height:120px;padding:12px;border-radius:var(--radius-sm);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.6;resize:vertical;transition:border-color .2s
}
.notes-textarea:focus{outline:none;border-color:var(--accent)}
.notes-textarea::placeholder{color:var(--text3)}

/* ===== GEN AREA ===== */
.gen-area{text-align:center;padding:24px;display:none;margin-bottom:24px}
.gen-area p{color:var(--text2);font-size:13px;margin-bottom:12px}

/* ===== CARD ===== */
.card{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:20px;margin-bottom:14px;transition:all .2s
}
.card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(99,97,75,0.1)}

/* diff tags */
.diff-tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.diff-easy{background:rgba(34,197,94,0.15);color:#1a8a3f}
.diff-medium{background:rgba(196,98,42,0.12);color:var(--accent)}
.diff-hard{background:rgba(200,40,40,0.12);color:#a22}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.q-body{
  background:var(--surface2);border-left:3px solid var(--accent);
  padding:14px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom:6px;font-size:14px;line-height:1.7;color:var(--text)
}
.q-why{font-size:12px;color:var(--text3);margin-bottom:14px}

.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px}
.rating-group{display:flex;align-items:center;gap:4px}
.rating-label{font-size:12px;color:var(--text3);margin-right:4px}
.rating-dot{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--border2);
  background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;
  transition:all .2s;display:inline-flex;align-items:center;justify-content:center
}
.rating-dot:hover{border-color:var(--accent);color:var(--accent)}
.rating-dot.selected{background:var(--accent);border-color:var(--accent);color:#fff}

/* AI result */
.ai-result{
  margin-top:12px;padding:14px;border-radius:var(--radius-sm);
  background:var(--surface2);border:1px solid var(--border2);
  font-size:13px;line-height:1.7;display:none;color:var(--text)
}
.ai-result.show{display:block}
.ai-result.loading{color:var(--text3)}
.ai-result .score-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ai-result .score-item{
  padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,0.6);border:1px solid var(--border2);color:var(--text)
}

/* ===== HISTORY PANEL (slide-out) ===== */
.history-overlay{
  position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.25);
  display:none
}
.history-overlay.open{display:block}
.history-panel{
  position:fixed;top:56px;right:0;bottom:0;z-index:160;
  width:320px;background:var(--history);border-left:1px solid var(--border2);
  transform:translateX(100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;padding:20px 16px;
  /* left edge is draggable via JS — CSS does the base */
}
.history-panel.open{transform:translateX(0)}
.history-panel h4{font-size:13px;font-weight:700;margin-bottom:16px;color:var(--text)}
.history-list{flex:1;overflow-y:auto}
.sess-item{
  padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;
  border:1px solid var(--border2);margin-bottom:8px;transition:all .15s;
  background:rgba(255,255,255,0.5)
}
.sess-item:hover{border-color:var(--accent);background:rgba(255,255,255,0.75)}
.sess-name{font-size:13px;font-weight:600;margin-bottom:2px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-meta{font-size:11px;color:var(--text3)}
.sess-avg{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.sidebar-empty{font-size:12px;color:var(--text3);text-align:center;padding:24px 0}
.history-actions{margin-top:12px;display:flex;gap:6px}

/* Drag handle on left edge of history panel */
.history-handle{
  position:absolute;left:0;top:0;bottom:0;width:6px;cursor:col-resize;
  background:transparent;transition:background .15s
}
.history-handle:hover,.history-handle.active{background:var(--accent);opacity:0.5}

/* Config inline in history panel */
.inline-config{margin-top:16px;padding-top:12px;border-top:1px solid var(--border2)}
.inline-config label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.inline-config input{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.7);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:12px;margin-bottom:8px
}
.inline-config input:focus{outline:none;border-color:var(--accent)}
.inline-config select{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.7);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:12px;margin-bottom:8px
}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:300;
  padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  background:var(--surface2);border:1px solid var(--border2);box-shadow:0 8px 20px rgba(0,0,0,0.15);
  transform:translateY(100px);opacity:0;transition:all .3s;color:var(--text)
}
.toast.show{transform:translateY(0);opacity:1}

/* ===== SETTINGS MODAL ===== */
.settings-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.3);
  display:none;align-items:center;justify-content:center
}
.settings-overlay.open{display:flex}
.settings-dialog{
  background:var(--history);border:1px solid var(--border2);border-radius:var(--radius);
  padding:24px;width:320px;max-width:90vw;box-shadow:0 16px 40px rgba(0,0,0,0.2);
  --text:#6F7C80;--text2:#8a9598;--text3:#a5aeb0
}
.settings-dialog h3{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
.settings-dialog label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.settings-dialog input{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.7);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:12px;margin-bottom:12px
}
.settings-dialog input:focus{outline:none;border-color:var(--accent)}
.settings-dialog select{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.7);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:12px;margin-bottom:12px
}
.settings-dialog .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.settings-dialog .hint{font-size:10px;color:var(--text3);margin-bottom:12px}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 24px;color:var(--text3)}

/* ===== SPIN ===== */
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== LAYOUT MODES ===== */
.layout-wrap{display:flex;gap:20px}
.layout-single{flex-direction:row}
.layout-double{flex-direction:column}
.layout-single .self-fill-col{flex:0 0 38%;min-width:260px}
.layout-single .gen-col{flex:1;min-width:0}
.layout-double .self-fill-col{width:100%;margin-bottom:24px}
.layout-double .gen-col{width:100%}

/* Self-fill Q&A box */
.self-fill-box{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;transition:all .2s;
  --text:#6F7C80;--text2:#8a9598;--text3:#a5aeb0
}
.self-fill-box:hover{border-color:var(--accent)}
.self-fill-box .sf-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.self-fill-box .sf-label{font-size:12px;font-weight:700;color:var(--text)}
.self-fill-box .sf-q{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--font);font-size:13px;margin-bottom:8px
}
.self-fill-box .sf-q:focus{outline:none;border-color:var(--accent)}
.self-fill-box .sf-q::placeholder{color:var(--text3)}
.sf-remove{background:none;border:none;color:#c44;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.sf-remove:hover{background:rgba(204,68,68,0.1)}
.sf-add-wrap{text-align:center;margin-bottom:20px}

/* Section label */
.section-label{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:6px}
.section-label span{font-weight:400;font-size:12px;color:var(--text3)}


/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .body-wrap{flex-direction:column}
  .history-panel{width:100%!important}
  .layout-single{flex-direction:column}
  .layout-single .self-fill-col{flex:auto;min-width:0}
}
@media(max-width:640px){
  .main{padding:16px}
  .card{padding:16px}
  .card-foot{flex-direction:column;align-items:flex-start}
  .layout-wrap{gap:12px}
  .self-fill-box{padding:12px}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-l">
    <button class="btn btn-ghost btn-sm" id="btnBack" style="display:none" onclick="resetAll()">← 返回</button>
    <div class="logo">⚡ 压面<span>题库生成</span>中心</div>
  </div>
  <div class="header-r">
    <span style="font-size:12px;color:var(--text2)" id="docName">未上传文件</span>
    <div class="ai-dot" id="aiDot" title="AI状态"></div>
    <button class="btn btn-ghost" onclick="toggleHistory()">📂 历史</button>
    <button class="btn btn-ghost" onclick="toggleConfig()">⚙️设置</button>
  </div>
</header>

<!-- ===== BODY ===== -->
<div class="body-wrap">
<main class="main" id="main">

  <!-- Upload -->
  <div id="uploadZone" class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <div style="font-size:40px;margin-bottom:12px">📄</div>
    <h3>上传文件生成压面题库</h3>
    <p>拖拽或点击上传。AI 读懂文档后自动生成针对性问题</p>
    <div class="format-badges">
      <span class="format-badge">PDF</span><span class="format-badge">DOCX</span><span class="format-badge">PPTX</span><span class="format-badge">TXT</span>
    </div>
    <div style="margin-top:20px">
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();pasteText()">📋 直接粘贴文字</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.txt">

  <!-- Preview -->
  <div class="preview-box" id="previewBox">
    <h4>📋 已提取文档内容 <span id="textStats" style="font-weight:400;font-size:12px;color:var(--text3)"></span></h4>
    <textarea class="notes-textarea" id="previewText" style="min-height:160px" placeholder="提取的文字会显示在这里，可直接编辑..."></textarea>
    <div style="margin-top:8px;font-size:11px;color:var(--text3)">可手动修正后点生成</div>
  </div>

  <!-- Generate button -->
  <div class="gen-area" id="genArea">
    <p>确认文字无误后，让 AI 读懂全文并生成题库</p>
    <button class="btn btn-primary" id="genBtn" onclick="generateQuestions()">🤖 AI 生成题库</button>
    <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="resetAll()">重新上传</button>
  </div>

  <!-- Cards -->
  <div id="cardsArea"></div>

  <!-- Empty -->
  <div class="empty-state" id="emptyState">
    <div style="font-size:48px;margin-bottom:12px">🧊</div>
    <p>由于本地无法识别，请在设置中输入自己的API后方可使用</p>
  </div>
</main>

<!-- ===== HISTORY PANEL (slide-out) ===== -->
<div class="history-overlay" id="historyOverlay" onclick="toggleHistory()"></div>
<aside class="history-panel" id="historyPanel">
  <div class="history-handle" id="historyHandle"></div>
  <h4>📂 历史存档</h4>
  <div class="history-list" id="sidebarList">
    <div class="sidebar-empty">暂无存档</div>
  </div>
  <div class="history-actions">
    <button class="btn btn-sm btn-ghost" onclick="saveSession()">💾 保存当前</button>
    <button class="btn btn-sm btn-danger" onclick="clearSessions()">清空</button>
  </div>
</aside>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ===== SETTINGS MODAL ===== -->
<div class="settings-overlay" id="settingsOverlay" onclick="toggleConfig()">
  <div class="settings-dialog" onclick="event.stopPropagation()">
    <h3>⚙ API 设置</h3>
    <label>AI 服务商</label>
    <select id="cfgProvider" onchange="saveCfg()">
      <option value="deepseek">DeepSeek</option>
      <option value="doubao">豆包</option>
    </select>
    <label>API Key（可选）</label>
    <input type="password" id="cfgKey" placeholder="sk-..." onchange="saveCfg()">
    <label>界面布局</label>
    <select id="cfgLayout" onchange="saveCfg();renderLayout()">
      <option value="single">单栏（左自填 · 右生成）</option>
      <option value="double">双栏（上自填 · 下生成）</option>
    </select>
    <p class="hint">Key 仅存本地。留空使用内置本地分析引擎</p>
    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" onclick="toggleConfig()">关闭</button>
    </div>
  </div>
</div>

<script>
try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e) { console.warn('pdf.js not loaded'); }
if (typeof mammoth === 'undefined') { console.warn('mammoth.js not loaded'); }

// ========== STATE ==========
var S = {
  provider: 'deepseek',
  apiKey: '',
  docName: '',
  docText: '',
  questions: [], // { id, question, difficulty, why, notes, rating }
  layoutMode: 'single',
  selfFill: [{id:0,question:'',notes:''},{id:1,question:'',notes:''}]
};

// ========== STORAGE ==========
function saveCfg() {
  S.provider = document.getElementById('cfgProvider').value;
  S.apiKey = document.getElementById('cfgKey').value.trim();
  S.layoutMode = document.getElementById('cfgLayout').value;
  var data = { provider: S.provider, apiKey: S.apiKey, layoutMode: S.layoutMode, sessions: getSessions() };
  localStorage.setItem('pp_v1', JSON.stringify(data));
  updateDot();
}
function loadCfg() {
  try {
    var raw = localStorage.getItem('pp_v1');
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d.provider) S.provider = d.provider;
    if (d.apiKey) S.apiKey = d.apiKey;
    if (d.layoutMode) S.layoutMode = d.layoutMode;
  } catch(e) {}
}
function updateDot() {
  var dot = document.getElementById('aiDot');
  if (S.apiKey) { dot.classList.add('active'); dot.title = 'AI 已连接'; }
  else { dot.classList.remove('active'); dot.title = '本地引擎模式'; }
}

// ========== SESSIONS ==========
function getSessions() {
  try { return JSON.parse(localStorage.getItem('si_sessions') || '[]'); } catch(e) { return []; }
}
function saveSessions(list) {
  localStorage.setItem('si_sessions', JSON.stringify(list));
}
function saveSession() {
  if (!S.questions.length) { toast('没有可保存的问题'); return; }
  var sessions = getSessions();
  var avg = 0, cnt = 0;
  S.questions.forEach(function(q) { if (q.rating) { avg += q.rating; cnt++; } });
  avg = cnt ? (avg / cnt).toFixed(1) : '-';
  var snap = {
    id: Date.now(),
    date: new Date().toLocaleString('zh-CN'),
    docName: S.docName || '未命名',
    avgRating: avg,
    questions: S.questions.map(function(q) {
      return { id:q.id, question:q.question, difficulty:q.difficulty, why:q.why, notes:q.notes, rating:q.rating };
    }),
    selfFill: S.selfFill.map(function(sf) {
      return { id:sf.id, question:sf.question, notes:sf.notes };
    })
  };
  sessions.unshift(snap);
  if (sessions.length > 20) sessions = sessions.slice(0, 20);
  saveSessions(sessions);
  renderSidebar();
  toast('已保存到存档');
}
function loadSession(id) {
  var sessions = getSessions();
  var snap = sessions.find(function(s) { return s.id === id; });
  if (!snap) return;
  S.docName = snap.docName; S.docText = '';

(function(){
  var handle, panel, startX, startW;
  document.addEventListener('DOMContentLoaded', function() {
    handle = document.getElementById('historyHandle');
    panel = document.getElementById('historyPanel');
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      startX = e.clientX;
      startW = panel.offsetWidth;
      handle.classList.add('active');
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', onDrop);
    });
  });
  function onDrag(e) {
    var newW = startW + (startX - e.clientX);
    newW = Math.max(250, Math.min(600, newW));
    panel.style.width = newW + 'px';
  }
  function onDrop() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', onDrop);
  }
})();

// ========== FILE HANDLER ==========
var FileHandler = {
  handle: async function(file) {
    if (!file) return;
    if (S.questions.length) autoSaveCurrent();
    S.docName = file.name;
    document.getElementById('docName').textContent = file.name;
    try {
      var text = '';
      var ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'txt') {
        text = await new Promise(function(res, rej) {
          var r = new FileReader(); r.onload = function() { res(r.result); }; r.onerror = rej; r.readAsText(file);
        });
      } else if (ext === 'doc') {
        resetAll(); toast('暂不支持 .doc 格式，请转换为 .docx 或 .txt 后重试');
        return;
      } else if (ext === 'pptx') {
        text = await FileHandler.parsePPTX(file);
      } else if (ext === 'pdf') {
        var buf = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        var texts = [];
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var content = await page.getTextContent();
          texts.push(content.items.map(function(it) { return it.str; }).join(' '));
        }
        text = texts.join('\n');
      } else if (ext === 'docx') {
        var buf = await file.arrayBuffer();
        var result = await mammoth.extractRawText({ arrayBuffer: buf });
        text = result.value;
      } else {
        resetAll(); toast('不支持的文件格式');
        return;
      }
      if (!text || text.trim().length < 20) {
        resetAll();
        toast('提取文字不足（' + (text ? text.trim().length : 0) + ' 字），请检查或直接粘贴');
        document.getElementById('previewBox').style.display = 'block';
        document.getElementById('previewText').value = text || '';
        return;
      }
      S.docText = text; S.questions = [];
      localStorage.removeItem('pp_v1_q');
      showAfterUpload(text);
      toast('已提取 ' + text.length + ' 字，确认后点生成');
    } catch (err) {
      console.error(err); resetAll(); toast('文件解析失败：' + err.message);
    }
  },

  parsePPTX: async function(file) {
    try {
      if (typeof JSZip === 'undefined') throw new Error('JSZip 未加载');
      var zip = await JSZip.loadAsync(file);
      var slideFiles = [];
      zip.forEach(function(path, entry) {
        if (/ppt\/slides\/slide\d+\.xml/.test(path) && !entry.dir) {
          slideFiles.push(path);
        }
      });
      slideFiles.sort();
      if (slideFiles.length === 0) throw new Error('未找到幻灯片内容');
      var allText = [];
      for (var si = 0; si < slideFiles.length; si++) {
        var xmlContent = await zip.file(slideFiles[si]).async('string');
        var texts = xmlContent.match(/<a:t[^>]*>([^<]*)<\/a:t>/g) || [];
        var slideText = texts.map(function(t) {
          return t.replace(/<a:t[^>]*>/, '').replace(/<\/a:t>/, '').trim();
        }).filter(function(t) { return t.length > 0; }).join(' ');
        if (slideText.length > 0) allText.push(slideText);
      }
      return allText.join('\n');
    } catch(e) {
      console.error('PPTX parse error:', e);
      return '';
    }
  }

};

// ========== LOCAL AI ENGINE (5-point, 4 dims) ==========
function localAnalyze(question, notes, docSnippet) {
  var n = notes || '';
  var nLen = n.trim().length;

  // --- helper: pick out key phrases from the notes ---
  var sentences = n.split(/[。！？；\n\.!\?;]+/).filter(function(s){return s.trim().length>3;});
  var firstSentence = sentences[0] || '';
  var hasNumbers = /\d+/.test(n);
  var numberPhrases = n.match(/\d+[^\s。,！？]{0,8}/g) || [];
  var hasExamples = /例如|比如|具体|案例|有一次|当时|那时候|记得|上个|去年|前段|最近|之前|经历/.test(n);
  var examplePhrase = n.match(/(?:例如|比如|具体|案例|有一次|当时|记得)[^。！？\n]{4,40}/);
  var hasBecause = /因为|所以|原因|导致|由于|结果|因此|从中/.test(n);
  var hasBut = /但是|然而|不过|虽然|可是|却/.test(n);
  var hasMaybe = /可能|也许|不一定|取决于|看情况|或许|大概|差不多/.test(n);
  var hasSelfReflect = /我|自己|当时|后来|现在|之前|以后|反省|思考|意识|发现|觉得|认为/.test(n);
  var vagueWords = /大概|差不多|还行|还好|一般般|反正|就这样|不知道|不清楚|随便|都可以/.test(n);
  var fillerRatio = (n.match(/嗯|啊|呃|那个|这个|就是|然后|其实|那种/g) || []).length / Math.max(1, nLen/10);

  // --- keyword mode detection (notes may be keywords, not full sentences) ---
  var isKeywordMode = false;
  var keywordCount = 0;
  if (nLen > 0 && sentences.length === 0 && nLen < 120) {
    var keywords = n.split(/[,，、\s\n]+/).filter(function(k){return k.trim().length > 0;});
    keywordCount = keywords.length;
    if (keywordCount >= 2) isKeywordMode = true;
  }
  var effectiveLen = isKeywordMode ? keywordCount * 15 : nLen;

  // --- scoring ---
  // Logic: has structure (because+but), has self-reflection, not just filler
  var logic = 2;
  if (hasBecause && nLen > 30) logic = 3;
  if (hasBecause && hasBut && nLen > 60) logic = 4;
  if (hasBecause && hasBut && hasSelfReflect && nLen > 120) logic = 5;
  if (nLen < 15) logic = 1;
  if (fillerRatio > 0.3) logic = Math.max(1, logic - 1);

  // Depth: goes beyond surface, considers alternatives, shows self-awareness
  var depth = 2;
  if ((hasBecause || hasBut) && nLen > 40) depth = 3;
  if (hasBecause && hasBut && nLen > 80) depth = 4;
  if (hasBecause && hasBut && hasMaybe && hasSelfReflect && nLen > 150) depth = 5;
  if (nLen < 20) depth = 1;
  if (fillerRatio > 0.25) depth = Math.max(1, depth - 1);

  // Precision: uses numbers, concrete examples, specific time/places
  var precision = 2;
  if (hasExamples || hasNumbers) precision = 3;
  if (hasExamples && hasNumbers) precision = 4;
  if (hasExamples && numberPhrases.length >= 2 && nLen > 100) precision = 5;
  if (nLen < 15) precision = 1;
  if (vagueWords) precision = Math.max(1, precision - 1);

  // Composure: maintains coherence under pressure, doesn't fall apart
  var composure = 2;
  if (nLen > 50 && sentences.length >= 3) composure = 3;
  if (nLen > 100 && sentences.length >= 5 && hasSelfReflect) composure = 4;
  if (nLen > 180 && sentences.length >= 7 && hasBecause && hasSelfReflect) composure = 5;
  if (nLen < 15) composure = 1;
  if (fillerRatio > 0.35) composure = Math.max(1, composure - 1);

  var overall = Math.round((logic + depth + precision + composure) / 4);

  // --- keyword mode adjustments ---
  if (isKeywordMode) {
    precision = Math.min(5, precision + 1);
    logic = Math.min(5, logic + 1);
    overall = Math.round((logic + depth + precision + composure) / 4);
  }

  // --- build content-specific comments (dynamically reference notes) ---
  function buildDim(score, label, strengths, gaps) {
    return '<strong>' + label + ' ' + score + '/5</strong><br>✓ ' + strengths + '<br>✗ ' + gaps;
  }
  // Helper: grab a short quote from notes
  function noteSnippet(len) {
    var s = n.replace(/\s+/g, ' ').trim();
    return s.length > len ? s.slice(0, len) + '…' : s;
  }

  // Logic comment
  var logicGood = '';
  if (hasBecause && hasBut) {
    var bp = (n.match(/因为[^。！？\n]{0,30}/) || [])[0] || '';
    logicGood = '既有因果分析也有转折思考，结构完整' + (bp ? '（如"' + bp + '"）' : '');
  } else if (hasBecause) {
    var bp2 = (n.match(/因为[^。！？\n]{0,30}/) || [])[0] || (n.match(/所以[^。！？\n]{0,30}/) || [])[0] || '';
    logicGood = '能说出原因，有一定因果意识' + (bp2 ? '（如"' + bp2 + '"）' : '');
  } else if (nLen > 60) {
    logicGood = '篇幅够长但缺少因果链条——"' + noteSnippet(40) + '"中未体现"因为…所以…"结构';
  } else {
    logicGood = '内容偏少（"' + noteSnippet(30) + '"），无法评估推理结构';
  }
  var logicGap = '';
  if (!hasBecause && nLen > 20) {
    logicGap = '未体现因果推理，建议追问"为什么会这样"让受访者展开';
  } else if (!hasBut && nLen > 20) {
    logicGap = '未提到反例或限制条件，追问"有没有例外情况"检验思维广度';
  } else {
    logicGap = '继续施压：追问"如果前提变了会怎样"测试推理韧性';
  }

  // Depth comment
  var depthGood = '';
  if (hasMaybe && hasSelfReflect) {
    var mq = (n.match(/可能[^。！？\n]{0,25}/) || [])[0] || (n.match(/也许[^。！？\n]{0,25}/) || [])[0] || '';
    depthGood = '能意识到事情非黑即白，并且反思自己的立场' + (mq ? '（"' + mq + '"）' : '');
  } else if (hasBut) {
    depthGood = '能想到事情的另外一面，有多角度意识——"' + noteSnippet(50) + '"';
  } else if (hasSelfReflect) {
    depthGood = '能从自身角度谈感受，但缺少对不同可能性的探索';
  } else {
    depthGood = '回答直接，未展开多层次思考——"' + noteSnippet(40) + '"';
  }
  var depthGap = '';
  if (!hasMaybe && !hasBut) {
    depthGap = '建议追问"有没有别的可能？"帮受访者跳出单一视角';
  } else if (!hasSelfReflect) {
    depthGap = '受访者在讲事情但没讲自己——缺少"我当时怎么想的"这层反思';
  } else {
    depthGap = '继续深挖：追问"那时候你为什么那样选而不是另一种？"';
  }

  // Precision comment - already had good quoting, keep enhanced
  var precGood = '';
  if (hasExamples && hasNumbers) {
    precGood = '有具体案例' + (examplePhrase ? '（如"' + examplePhrase[0].slice(0, 40) + '"）' : '') + '，也有数字化信息，回答比较落地';
  } else if (hasExamples) {
    precGood = '有具体场景或事例' + (examplePhrase ? '（"' + examplePhrase[0].slice(0, 40) + '"）' : '') + '，比空谈好';
  } else if (hasNumbers) {
    precGood = '提到了数字有量化意识' + (numberPhrases.length ? '（如' + numberPhrases[0] + '）' : '') + '——"' + noteSnippet(40) + '"';
  } else {
    precGood = '回答偏概括——"' + noteSnippet(40) + '"中缺少具体例子或数据';
  }
  var precGap = '';
  if (!hasExamples && !hasNumbers) {
    precGap = '全程没有具体例子和数字——直接问"能举个具体例子吗"';
  } else if (!hasExamples) {
    precGap = '有数字但缺故事——一个真实场景比十个数据更有说服力';
  } else if (!hasNumbers) {
    precGap = '有例子但缺量化信息——追问"大概多少""频率多高"来补这一块';
  } else {
    precGap = '继续追问"还有别的类似例子吗"看受访者能否举出不同场景';
  }

  // Composure comment
  var compGood = '';
  if (sentences.length >= 5 && hasSelfReflect) {
    compGood = '层次分明（' + sentences.length + '个要点），能边讲边分析，节奏稳';
  } else if (sentences.length >= 3) {
    compGood = '能分出' + sentences.length + '个点来说，思路没乱——"' + noteSnippet(50) + '"';
  } else {
    compGood = nLen > 30 ? '说了不少但结构不太清晰——"' + noteSnippet(50) + '"' : '回答很短（' + nLen + '字），看不出压力下真实表现';
  }
  var compGap = '';
  if (fillerRatio > 0.2) {
    compGap = '口头禅偏多（填充词占比' + Math.round(fillerRatio * 100) + '%），等受访者说完再追问，看他能否自己整理';
  } else if (sentences.length < 3 && nLen > 40) {
    compGap = '内容有但一口气说完缺层次——打断问"等一下，刚才那点能再展开吗"';
  } else {
    compGap = '保持当前追问力度，观察受访者是否开始出现前后矛盾';
  }

  return {
    logic: logic, depth: depth, precision: precision, composure: composure, overall: overall,
    dims: [
      buildDim(logic, '逻辑性', logicGood, logicGap),
      buildDim(depth, '思考深度', depthGood, depthGap),
      buildDim(precision, '具体程度', precGood, precGap),
      buildDim(composure, '应变能力', compGood, compGap)
    ],
    comment: (isKeywordMode ? '笔记为关键词记录（' + keywordCount + '个关键词），分析基于关键词推断。' : '') +
             (isKeywordMode ? '基于关键词评估，完整度受记录方式限制。' :
              nLen < 15 ? '回答太短（' + nLen + '字），多数维度无法评估。建议用开放式问题引导受访者多说。' :
              nLen < 40 ? '回答偏简短（' + nLen + '字）。建议追问"能具体说说吗"让受访者展开。' :
              (function() {
                var parts = [];
                if (logic >= 4) parts.push('逻辑性较强');
                if (depth >= 4) parts.push('思考有深度');
                if (precision >= 4) parts.push('回答具体');
                if (composure >= 4) parts.push('应变从容');
                if (parts.length === 0) parts.push('各维度均有提升空间');
                var weakest = '';
                var scores = [{n:'逻辑性',v:logic},{n:'思考深度',v:depth},{n:'具体程度',v:precision},{n:'应变能力',v:composure}];
                scores.sort(function(a,b){return a.v - b.v;});
                weakest = '；最弱项：' + scores[0].n + '(' + scores[0].v + '/5)';
                return '亮点：' + parts.join('、') + weakest + '。详情见各维度。';
              })()),
    tip: isKeywordMode ? '建议根据关键词逐一追问背后的具体故事，引导受访者展开。' :
         nLen < 15 ? '先让受访者放松，用开放式问题打开话匣子' :
         nLen < 40 ? '追问"比如呢""当时发生了什么"，拉出具体细节' :
         (function() {
           var tips = [];
           if (!hasExamples) tips.push('问"能不能讲一个真实发生的例子"');
           if (!hasBut) tips.push('问"那反对你的人会怎么说"');
           if (!hasBecause) tips.push('追问"为什么会这样"');
           if (fillerRatio > 0.2) tips.push('注意受访者口头禅偏多，可让其放慢语速');
           if (tips.length === 0) tips.push('盯住回答中最模糊的那个点不放，继续追问');
           return tips.length === 1 ? tips[0] : tips.join('；');
         })()
  };
}

// ========== AI: GENERATE QUESTIONS ==========
async function generateQuestions() {
  if (!S.docText) return;
  var btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ 正在生成...';
  document.getElementById('cardsArea').innerHTML = '<div class="gen-area"><div class="spin" style="font-size:24px">⏳</div><p style="margin-top:8px;color:var(--text2)">正在理解文档并生成题库...</p></div>';

  try {
    if (S.apiKey) {
      // Real AI
      var config = getAIConfig();
      var prompt = [
        '你是一位面试官，正在为压力面试准备题库。先仔细读懂下面这份文档，然后生成 8 个面试问题。',
        '', '【文档全文】', S.docText, '',
        '要求：基于文档具体内容提问；语言口语化，像真人面试官聊天；每个问题1-2句话；难度由浅入深；每个问题从不同角度切入；',
        '返回纯JSON数组（不要markdown包裹）：',
        '[{"id":"1","question":"...","difficulty":"简单|中等|有难度","why":"为什么问这个"},...]'
      ].join('\n');
      var resp = await fetch(config.endpoint, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.key},
        body:JSON.stringify({model:config.model,messages:[{role:'user',content:prompt}],temperature:0.85,max_tokens:3000})
      });
      if(!resp.ok) throw new Error('API 失败 ('+resp.status+')');
      var data = await resp.json();
      var content = data.choices[0].message.content.trim();
      content = content.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
      var questions = JSON.parse(content);
      if(!Array.isArray(questions)) throw new Error('返回格式异常');
      S.questions = questions.map(function(q,i){ return {id:'q'+i,question:q.question,difficulty:q.difficulty||'中等',why:q.why||'',notes:'',rating:0}; });
    } else {
      // Local fallback: use doc content to generate questions
      await new Promise(function(r){setTimeout(r,600);});
      S.questions = localGenerateQuestions(S.docText);
    }
    renderLayout();
    saveSession();
    document.getElementById('genArea').style.display = 'none';
    document.getElementById('previewBox').style.display = 'none';
    toast('已生成 ' + S.questions.length + ' 个问题');
  } catch(err) {
    console.error(err);
    document.getElementById('cardsArea').innerHTML = '';
    toast('生成失败：' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = '🤖 AI 生成题库';
  }
}

function localGenerateQuestions(text) {
  // --- Step 1: Strip personal-info lines before keyword extraction ---
  // Remove lines that are purely basic info (name, class, ID, contact, dates, headers)
  var personalLine = /(姓名|性别|年龄|民族|籍贯|出生|电话|手机|邮箱|地址|学号|编号|身份证|政治面貌|身高|体重|血型|婚姻|QQ|微信|院系|专业|班级|导师|日期|联系电话|通讯地址|电子邮箱|邮政编码|家庭住址|毕业院校|所在单位|本人|照片|求职意向|期望薪资|到岗时间|第.*页|共.*页|^\s*\d+[\.、\)]|^\s*[①②③④⑤⑥⑦⑧⑨⑩]|^\s*[（(][\d一二三四五六七八九十]+[）)])/;
  var lines = text.split(/[\n\r]+/);
  var meaningfulLines = [];
  for (var li = 0; li < lines.length; li++) {
    var line = lines[li].trim();
    if (line.length < 4) continue;
    if (personalLine.test(line)) continue;
    // Skip lines that are >50% digits
    var digits = (line.match(/\d/g) || []).length;
    if (digits > 0 && digits / line.length > 0.4) continue;
    meaningfulLines.push(line);
  }
  var cleaned = meaningfulLines.join(' ').replace(/[【】「」『』""''\[\]()（）\/\\.,，。！？：:；;、]+/g, ' ');

  // --- Step 2: Extract high-frequency meaningful keywords ---
  var words = cleaned.split(/\s+/).filter(function(w){ return w.length >= 2 && w.length <= 20; });
  var allTerms = [];
  for (var wi = 0; wi < words.length; wi++) {
    var w = words[wi];
    var parts = w.split(/[的了着过和与或是就被把从到在对为向以]/);
    for (var pi = 0; pi < parts.length; pi++) {
      var p = parts[pi].trim();
      if (p.length >= 2 && p.length <= 15) allTerms.push(p);
    }
  }
  
  // Stop words + personal info patterns to exclude from keywords
  var stopWords = /^(的|了|是|在|我|有|和|就|不|人|都|去|也|你|很|他|它|这|那|吗|呢|吧|啊|哦|嗯|而|及|与|或|但|所|被|从|到|对|向|以|可以|能够|需要|已经|没有|什么|怎么|如何|为什么|因为|所以|如果|虽然|然而|不过|还是|但是|这个|那个|这些|那些|我们|他们|你们|自己|大家|一个|一种|一些|许多|很多|很少|可能|已经|正在|将要|进行|通过|根据|按照|随着|成为|作出|给予|提出|使得|关于|对于|之后|之前|以后|之前|其中|其他|以及|而且|还有|此外|另外|最后|首先|其次|再次|最后|终于|结果|非常|特别|不同|相同|一样|几乎|完全|部分|全部|整个|某些|某种|任何|所有|一切|总是|经常|偶尔|有时|从未|从前|现在|将来|以后|之前|某次|本次|本次|各式|各项|经过|过来|过去|得到|到了|必须|应该|可能|极|该|有|没|无|最|很|极|太|更|较|稍|略|都|只|仅|光|单|共|总|全|整|半|满|干|湿|红|黄|蓝|绿|大|小|多|少|高|低|长|短|快|慢|新|旧|好|坏|对|错|贵|便|难|易|热|冷|前|后|左|右|上|下|中|内|外|旁|边)$/;
  // Personal info terms that should never become question keywords
  var infoTerms = /^(软件工程|计算机科学|信息管理|工商管理|市场营销|会计|金融|英语|法学|医学|土木|机械|电气|自动化|通信|电子|数学|物理|化学|生物|汉语言|新闻|历史|哲学|艺术|体育|音乐|美术|小学|中学|高中|大学|本科|硕士|博士|专科|男生|女生|团员|党员|群众|汉族|回族|维吾尔族|壮族|大一|大二|大三|大四|研一|研二|研三|博一|博二)$/;
  
  var freq = {};
  for (var ti = 0; ti < allTerms.length; ti++) {
    var term = allTerms[ti];
    if (stopWords.test(term)) continue;
    if (infoTerms.test(term)) continue;
    if (!/[一-鿿]/.test(term)) continue;
    freq[term] = (freq[term] || 0) + 1;
  }
  
  var sorted = Object.keys(freq).sort(function(a,b){ return freq[b] - freq[a]; });
  var keywords = sorted.filter(function(k){ return freq[k] >= 2; }).slice(0, 20);
  if (keywords.length < 5) {
    keywords = sorted.slice(0, 15);
  }
  if (keywords.length < 3) {
    // Fallback: extract meaningful snippets from non-personal lines
    keywords = [];
    for (var ri = 0; ri < meaningfulLines.length && keywords.length < 10; ri++) {
      var snippet = meaningfulLines[ri].replace(/\s+/g, '').slice(0, 25);
      if (snippet.length >= 3 && !infoTerms.test(snippet)) keywords.push(snippet);
    }
  }

  // --- Step 2: Aggressive pressure templates using keywords ---
  var templates = [
    { q: function(k){ return '你简历里写着你是【'+k+'】，但据我所知，这种岗位往往吃力不讨好——你怎么证明你的价值？'; }, diff: '有难度', why: '质疑身份价值' },
    { q: function(k){ return '你提到你做过【'+k+'】，有没有可能只是运气好？换一个人来也能做成？'; }, diff: '有难度', why: '区分能力与运气' },
    { q: function(k){ return '你说你擅长【'+k+'】，但具体数据呢？量化结果是什么？空口无凭。'; }, diff: '有难度', why: '逼出量化证据' },
    { q: function(k){ return '关于【'+k+'】——你遇到过最大的失败是什么？别讲成功的，讲搞砸的。'; }, diff: '有难度', why: '探测失败经历' },
    { q: function(k){ return '如果我是你【'+k+'】时的领导，我会说你这块做得一般——你怎么反驳我？'; }, diff: '有难度', why: '压力反驳测试' },
    { q: function(k){ return '你简历里反复提到【'+k+'】，但面试官最烦听套话——用一句话说服我你真有这个能力。'; }, diff: '中等', why: '提炼核心说服力' },
    { q: function(k){ return '回头看【'+k+'】，如果重来一次，你会做哪三个不一样的决策？为什么？'; }, diff: '中等', why: '检验反思深度' },
    { q: function(k){ return '团队里有比你更懂【'+k+'】的人，你怎么带他？怎么让他服你？'; }, diff: '有难度', why: '领导力挑战' }
  ];

  var questions = [];
  for (var i = 0; i < 8; i++) {
    var kIdx = i % keywords.length;
    var tIdx = i % templates.length;
    var kw = keywords[kIdx] || '这份工作';
    var t = templates[tIdx];
    questions.push({
      id: 'q'+i,
      question: t.q(kw),
      difficulty: t.diff,
      why: t.why,
      notes: '',
      rating: 0
    });
  }
  return questions;
}

// ========== AI: ANALYZE ANSWER ==========
async function analyzeAnswer(qid) {
  var q = S.questions.find(function(q){return q.id===qid;});
  if (!q) return;
  var btn = document.getElementById('aiBtn-'+qid);
  var div = document.getElementById('aiRes-'+qid);
  btn.disabled = true; btn.textContent = '⏳';
  div.className = 'ai-result show loading';
  div.textContent = '分析中...';

  try {
    var result;
    if (S.apiKey) {
      var config = getAIConfig();
      var isShort = (q.notes || '').trim().length < 30;
      var prompt = [
        '你是面试官。以下是你提的问题和受访者的回答笔记。请从4个维度评分（1-5分），每个维度给一句优点和一句缺点（必须引用笔记中的具体内容）。返回纯JSON。',
        '问题：'+q.question,
        '难度：'+q.difficulty,
        '笔记：'+(q.notes||'未记录'),
        (isShort ? '注意：笔记可能为关键词记录（面试时间有限未完整录入），请基于关键词进行推断分析，不要因字数少而过度扣分。' : ''),
        '返回格式：{"logic":N,"depth":N,"precision":N,"composure":N,"overall":N,"dimPros":["逻辑优点（必须引用笔记原文）","深度优点（必须引用笔记原文）","具体优点","应变优点"],"dimCons":["逻辑缺点","深度缺点","具体缺点","应变缺点"]}'
      ].join('\n');
      var resp = await fetch(config.endpoint, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.key},
        body:JSON.stringify({model:config.model,messages:[{role:'user',content:prompt}],temperature:0.7,max_tokens:500})
      });
      if(!resp.ok) throw new Error('API 失败 ('+resp.status+')');
      var data = await resp.json();
      var raw = data.choices[0].message.content.trim();
      raw = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
      var a = JSON.parse(raw);
      result = {
        logic:a.logic||3, depth:a.depth||3, precision:a.precision||3, composure:a.composure||3, overall:a.overall||3,
        dims: [
          '<strong>逻辑性 '+a.logic+'/5</strong><br>✓ '+(a.dimPros?.[0]||'') +'<br>✗ '+(a.dimCons?.[0]||''),
          '<strong>思考深度 '+a.depth+'/5</strong><br>✓ '+(a.dimPros?.[1]||'') +'<br>✗ '+(a.dimCons?.[1]||''),
          '<strong>具体程度 '+a.precision+'/5</strong><br>✓ '+(a.dimPros?.[2]||'') +'<br>✗ '+(a.dimCons?.[2]||''),
          '<strong>应变能力 '+a.composure+'/5</strong><br>✓ '+(a.dimPros?.[3]||'') +'<br>✗ '+(a.dimCons?.[3]||'')
        ],
        comment: '',
        tip: ''
      };
    } else {
      result = localAnalyze(q.question, q.notes, S.docText.slice(0,1500));
    }

    div.className = 'ai-result show';
    div.innerHTML =
      '<div class="score-bar">' +
        '<span class="score-item">逻辑性 ' + result.logic + '/5</span>' +
        '<span class="score-item">思考深度 ' + result.depth + '/5</span>' +
        '<span class="score-item">具体程度 ' + result.precision + '/5</span>' +
        '<span class="score-item">应变能力 ' + result.composure + '/5</span>' +
        '<span class="score-item" style="background:var(--accent);color:#fff;font-weight:700">总分 ' + result.overall + '/5</span>' +
      '</div>' +
      result.dims.map(function(d){ return '<div style="margin-bottom:8px;line-height:1.7">'+d+'</div>'; }).join('') +
      (result.comment ? '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border2)">'+result.comment+'</div>' : '') +
      (result.tip ? '<div style="margin-top:4px">💡 '+result.tip+'</div>' : '');
  } catch(err) {
    div.className = 'ai-result show';
    div.innerHTML = '<span style="color:#c44">❌ ' + err.message + '</span>';
  } finally {
    btn.disabled = false; btn.textContent = '🤖 AI 分析';
  }
}

// ========== CARD RENDERING ==========
function renderLayout() {
  var area = document.getElementById('cardsArea');
  if (!S.questions.length) { area.innerHTML = ''; return; }

  var isSingle = S.layoutMode === 'single';
  var wrapClass = isSingle ? 'layout-single' : 'layout-double';

  // --- Build self-fill section ---
  var sfHtml = '<div class="self-fill-col">';
  sfHtml += '<div class="section-label">📝 自填问答 <span>（自定义问题并记录回答）</span></div>';
  for (var si = 0; si < S.selfFill.length; si++) {
    var sf = S.selfFill[si];
    sfHtml += '<div class="self-fill-box" id="sfbox-'+sf.id+'">';
    sfHtml += '<div class="sf-header"><span class="sf-label">#'+(si+1)+'</span>';
    if (S.selfFill.length > 1) {
      sfHtml += '<button class="sf-remove" onclick="removeSelfFill('+sf.id+')" title="移除">✕</button>';
    }
    sfHtml += '</div>';
    sfHtml += '<input class="sf-q" id="sfq-'+sf.id+'" placeholder="输入你想问的问题..." value="'+escHtml(sf.question||'')+'" onchange="saveSelfFill('+sf.id+')">';
    sfHtml += '<textarea class="notes-textarea" id="sfn-'+sf.id+'" placeholder="记录受访者的回答笔记..." onchange="saveSelfFill('+sf.id+')" style="min-height:80px">'+escHtml(sf.notes||'')+'</textarea>';
    sfHtml += '<div class="card-foot">';
    sfHtml += '<button class="btn btn-primary btn-sm" id="gradeBtn-'+sf.id+'" onclick="gradeSelfFill('+sf.id+')">🤖 语义批改</button>';
    sfHtml += '<span style="font-size:12px;color:var(--text2);margin-left:8px" id="gradeHint-'+sf.id+'">对比标准答案与受访者回答</span>';
    sfHtml += '</div>';
    sfHtml += '<div class="ai-result" id="gradeRes-'+sf.id+'"></div>';
    sfHtml += '</div>';
  }
  sfHtml += '<div class="sf-add-wrap"><button class="btn btn-ghost btn-sm" onclick="addSelfFill()">＋ 添加自填问题</button></div>';
  sfHtml += '</div>';

  // --- Build generated questions section ---
  var groups = { '有难度': [], '中等': [], '简单': [] };
  S.questions.forEach(function(q) {
    var key = q.difficulty || '中等';
    if (!groups[key]) groups[key] = [];
    groups[key].push(q);
  });

  var genHtml = '<div class="gen-col">';
  genHtml += '<div class="section-label">🤖 系统生成题库 <span>（共'+S.questions.length+'问）</span></div>';
  var order = ['简单', '中等', '有难度'];
  order.forEach(function(diff) {
    if (!groups[diff] || !groups[diff].length) return;
    var icon = diff === '有难度' ? '🔴' : diff === '中等' ? '🟡' : '🟢';
    genHtml += '<div style="font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--text);display:flex;align-items:center;gap:6px">' +
      icon + ' ' + diff + ' <span style="font-weight:400;font-size:11px;color:var(--text3)">' + groups[diff].length + ' 问</span></div>';
    groups[diff].forEach(function(q) {
      var diffClass = q.difficulty === '有难度' ? 'diff-hard' : q.difficulty === '中等' ? 'diff-medium' : 'diff-easy';
      genHtml +=
      '<div class="card" id="card-'+q.id+'">' +
        '<div class="card-top">' +
          '<span class="diff-tag '+diffClass+'">'+(q.difficulty||'中等')+'</span>' +
        '</div>' +
        '<div class="q-body">'+escHtml(q.question)+'</div>' +
        (q.why ? '<div class="q-why">💡 '+escHtml(q.why)+'</div>' : '') +
        '<div style="font-size:11px;color:var(--text3);margin-bottom:6px">📝 受访者回答笔记</div>' +
        '<textarea class="notes-textarea" id="notes-'+q.id+'" placeholder="记录受访者的回答..." onchange="saveCard(\''+q.id+'\')"></textarea>' +
        '<div class="card-foot">' +
          '<div class="rating-group">' +
            '<span class="rating-label">评分:</span>' +
            [1,2,3,4,5].map(function(v){ return '<button class="rating-dot" data-qid="'+q.id+'" data-val="'+v+'" onclick="setRating(\''+q.id+'\','+v+')">'+v+'</button>'; }).join('') +
          '</div>' +
          '<button class="btn btn-primary btn-sm" id="aiBtn-'+q.id+'" onclick="analyzeAnswer(\''+q.id+'\')">🤖 AI 分析</button>' +
          '<button class="btn btn-ghost btn-sm" id="gradeGBtn-'+q.id+'" onclick="gradeGenQuestion(\''+q.id+'\')" style="margin-left:4px">📊 语义批改</button>' +
        '</div>' +
        '<div class="ai-result" id="aiRes-'+q.id+'"></div>' +
        '<div class="ai-result" id="gradeGRes-'+q.id+'"></div>' +
      '</div>';
    });
  });
  genHtml += '</div>';

  // --- Combine ---
  area.innerHTML = '<div class="layout-wrap '+wrapClass+'">' +
    (isSingle ? sfHtml + genHtml : sfHtml + genHtml) +
  '</div>';

  // Restore generated question notes/ratings
  S.questions.forEach(function(q) {
    var ta = document.getElementById('notes-'+q.id);
    if (ta && q.notes) ta.value = q.notes;
    if (q.rating > 0) {
      var dots = document.querySelectorAll('.rating-dot[data-qid="'+q.id+'"]');
      dots.forEach(function(d){ if(+d.dataset.val <= q.rating) d.classList.add('selected'); });
    }
  });
}

// --- Self-fill management ---
function addSelfFill() {
  var newId = Math.max.apply(null, S.selfFill.map(function(sf){return sf.id;}).concat([0])) + 1;
  S.selfFill.push({id: newId, question: '', notes: ''});
  renderLayout();
  toast('已添加自填问题 #'+(S.selfFill.length));
}
function removeSelfFill(id) {
  if (S.selfFill.length <= 1) { toast('至少保留一个自填问题'); return; }
  S.selfFill = S.selfFill.filter(function(sf){return sf.id !== id;});
  renderLayout();
  toast('已移除');
}
function saveSelfFill(id) {
  var qEl = document.getElementById('sfq-'+id);
  var nEl = document.getElementById('sfn-'+id);
  var sf = S.selfFill.find(function(sf){return sf.id === id;});
  if (sf) {
    if (qEl) sf.question = qEl.value;
    if (nEl) sf.notes = nEl.value;
  }
}

function saveCard(qid) {
  var ta = document.getElementById('notes-'+qid);
  if (!ta) return;
  var q = S.questions.find(function(q){return q.id===qid;});
  if (q) q.notes = ta.value;
}
function setRating(qid, val) {
  var q = S.questions.find(function(q){return q.id===qid;});
  if (!q) return;
  q.rating = q.rating === val ? 0 : val;
  document.querySelectorAll('.rating-dot[data-qid="'+qid+'"]').forEach(function(d){
    d.classList.toggle('selected', +d.dataset.val <= q.rating);
  });
}

// ========== TRANSFORMERS.JS SEMANTIC GRADER ==========
var SemGrader = {
  modelReady: false,
  modelLoading: false,
  extractor: null,

  // Load the feature extraction pipeline
  load: async function() {
    if (SemGrader.modelReady) return true;
    if (SemGrader.modelLoading) {
      // Wait for existing load
      for (var w = 0; w < 100; w++) {
        if (SemGrader.modelReady) return true;
        if (!SemGrader.modelLoading) return false;
        await new Promise(function(r){setTimeout(r, 300);});
      }
      return SemGrader.modelReady;
    }
    SemGrader.modelLoading = true;
    try {
      if (typeof transformers === 'undefined') throw new Error('Transformers.js 未加载');
      SemGrader.extractor = await transformers.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
      SemGrader.modelReady = true;
      console.log('SemGrader model loaded');
      return true;
    } catch(e) {
      console.warn('SemGrader load failed:', e.message);
      SemGrader.modelLoading = false;
      return false;
    }
  },

  // Get embedding vector for a text
  embed: async function(text) {
    if (!text || !text.trim()) return null;
    try {
      var result = await SemGrader.extractor(text, { pooling: 'mean', normalize: true });
      return Array.from(result.data);
    } catch(e) { return null; }
  },

  // Cosine similarity between two vectors
  cosineSim: function(a, b) {
    if (!a || !b || a.length !== b.length) return 0;
    var dot = 0, na = 0, nb = 0;
    for (var i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      na += a[i] * a[i];
      nb += b[i] * b[i];
    }
    var denom = Math.sqrt(na) * Math.sqrt(nb);
    return denom > 0 ? dot / denom : 0;
  },

  // Grade: compare answer semantic relevance to question
  grade: async function(question, answer) {
    if (!question || !answer) return null;
    var ready = await SemGrader.load();
    if (!ready) return { error: '模型加载失败，请检查网络后刷新重试' };

    var embQ = await SemGrader.embed(question);
    var embA = await SemGrader.embed(answer);
    if (!embQ || !embA) return { error: '文本编码失败，请检查输入内容' };

    var sim = SemGrader.cosineSim(embQ, embA);
    var score = Math.round(sim * 100);
    // Adjust: question-answer pairs typically have lower raw similarity than exact matches
    var adjusted = Math.min(100, Math.round(score * 1.6));
    var level = adjusted >= 75 ? '切题' : adjusted >= 55 ? '基本切题' : adjusted >= 35 ? '部分相关' : '偏离';
    return {
      score: adjusted,
      level: level,
      similarity: sim.toFixed(3),
      hint: adjusted >= 75 ? '回答紧扣问题核心，语义高度相关。' :
            adjusted >= 55 ? '回答与问题较为相关，主要方向正确。' :
            adjusted >= 35 ? '回答与问题有一定关联，但可能未直接回应问题要点。' :
            '回答似乎偏离了问题方向，建议追问或澄清问题。'
    };
  }
};

// Grade a self-fill Q&A: compare answer against the question
async function gradeSelfFill(id) {
  var sf = S.selfFill.find(function(sf){return sf.id === id;});
  if (!sf) return;
  var question = sf.question || '';
  var answer = sf.notes || '';
  if (!question.trim()) { toast('请先填写问题'); return; }
  if (!answer.trim()) { toast('请先记录受访者回答'); return; }

  var btn = document.getElementById('gradeBtn-'+id);
  var hint = document.getElementById('gradeHint-'+id);
  var res = document.getElementById('gradeRes-'+id);
  btn.disabled = true; btn.textContent = '⏳ 分析中...';
  hint.textContent = '正在加载模型并计算语义相关性...';
  res.className = 'ai-result show loading';
  res.innerHTML = '<div class="spin" style="font-size:16px">⏳</div> 模型首次加载约需数秒（下载约 23MB），请耐心等待...';

  try {
    var result = await SemGrader.grade(question, answer);
    showGradeResult(res, hint, result, '回答与问题的语义相关性');
  } catch(err) {
    res.className = 'ai-result show';
    res.innerHTML = '<span style="color:#c44">❌ 批改失败：' + err.message + '</span>';
    hint.textContent = '出错了，请重试';
  } finally {
    btn.disabled = false; btn.textContent = '🤖 语义批改';
  }
}

// Grade a generated question: compare notes against the question
async function gradeGenQuestion(qid) {
  var q = S.questions.find(function(q){return q.id === qid;});
  if (!q) return;
  var question = q.question || '';
  var answer = q.notes || '';
  if (!answer.trim()) { toast('请先记录受访者回答笔记'); return; }

  var btn = document.getElementById('gradeGBtn-'+qid);
  var res = document.getElementById('gradeGRes-'+qid);
  btn.disabled = true; btn.textContent = '⏳';
  res.className = 'ai-result show loading';
  res.innerHTML = '<div class="spin" style="font-size:16px">⏳</div> 模型首次加载约需数秒（下载约 23MB）...';

  try {
    var result = await SemGrader.grade(question, answer);
    showGradeResult(res, null, result, '');
  } catch(err) {
    res.className = 'ai-result show';
    res.innerHTML = '<span style="color:#c44">❌ ' + err.message + '</span>';
  } finally {
    btn.disabled = false; btn.textContent = '🤖 语义批改';
  }
}

// Shared grade result display
function showGradeResult(res, hint, result, hintText) {
  res.className = 'ai-result show';
  if (result.error) {
    res.innerHTML = '<span style="color:#c44">❌ ' + result.error + '</span>';
    return;
  }
  var barColor = result.score >= 60 ? '#22c55e' : result.score >= 40 ? '#e07b39' : '#c44';
  res.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<div style="font-size:32px;font-weight:700;color:'+barColor+'">' + result.score + '%</div>' +
      '<div>' +
        '<span class="score-item" style="background:'+barColor+';color:#fff;font-weight:700">' + result.level + '</span>' +
        '<span class="score-item">语义相似度 ' + result.similarity + '</span>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:8px;line-height:1.7;color:var(--text)">💡 ' + result.hint + '</div>';
  if (hint && hintText) hint.textContent = hintText;
}

});
